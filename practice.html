<h2>اليوم 1: ما الذي تغيّر، وماذا نفعل به</h2>
<ol>
<li><p>لخّص مساعد المادة الخامسة من مشروع سياسة الذكاء الاصطناعي أولًا هكذا: «تُلزم السياسة شركات القطاع الخاص بوضع سياسات داخلية للذكاء الاصطناعي». بماذا تسم هذا الادعاء؟</p><ul><li><b>أ.</b> صحيح: المادة تذكر القطاع الخاص والسياسات الداخلية</li><li><b>ب.</b> خاطئ: المادة توصي القطاع الخاص ولا تُلزمه</li><li><b>ج.</b> غير مسند: المشروع لا يذكر القطاع الخاص أصلًا</li><li><b>د.</b> صحيح: ما تصدره سدايا ملزم للجهات كلها</li></ul></li>
<li><p>شركة سعودية تطور أداة تقييم ائتماني تبيعها لمقرض في كولورادو. في مذكرة مؤرخة 18 نوفمبر 2026، أين تضع واجب تزويد المقرض بالوثائق الفنية الذي يبدأ في 1 يناير 2027؟</p><ul><li><b>أ.</b> الآن: ملزم، ويسري قبل الإصدار التالي</li><li><b>ب.</b> التالي: موعده لم يأتِ بعد</li><li><b>ج.</b> قيد المتابعة: الأمر التنفيذي أوقف قوانين الولايات</li><li><b>د.</b> لا ينطبق: الشركة ليست أمريكية</li></ul></li>
<li><p>في اجتماع الإحاطة قال عضو في الفريق التنفيذي: «الضوابط الأساسية للأمن السيبراني ملزمة، فلنكتبها في الآن لكل أنظمتنا». شركتكم خاصة، لا تملك بنية تحتية حساسة ولا تورّد لجهة حكومية. ما الرد الصحيح؟</p><ul><li><b>أ.</b> نكتبها في الآن، فهي ضوابط ملزمة من جهة مختصة</li><li><b>ب.</b> نكتبها قيد المتابعة، فهي ما زالت مطروحة لمرئيات العموم</li><li><b>ج.</b> لا تنطبق على أي شركة خاصة، فهي للجهات الحكومية وحدها</li><li><b>د.</b> لا نكتبها واجبًا علينا، فهي تخاطب جهات لسنا منها</li></ul></li>
<li><p>نشرت هيئة قطاعية «دليل ممارسات» للذكاء الاصطناعي، تتكرر فيه عبارة «يجب على الجهات»، ولا يذكر جزاءً ولا أداة نظامية، ويصف نفسه في مقدمته بأنه للاسترشاد. ما قوة هذا النص؟</p><ul><li><b>أ.</b> ملزم: فيه «يجب»، وأصدرته جهة مختصة بالقطاع</li><li><b>ب.</b> مشروع: لم يصدر بقرار من مجلس الوزراء</li><li><b>ج.</b> استرشادي: يصف نفسه بذلك، ولا جزاء فيه بذاته</li><li><b>د.</b> ملزم: ما تنشره الهيئات القطاعية واجب التطبيق</li></ul></li>
<li><p>لائحة نافذة صادرة عن هيئة قطاعية تخاطب مشغلي الاتصالات المرخّصين. شركتك لا تحمل ترخيصًا، وتبيع أحد المشغلين أداة ذكاء اصطناعي لخدمة العملاء. ما وضع اللائحة بالنسبة لشركتك؟</p><ul><li><b>أ.</b> تلزم الشركة مباشرة، فهي لائحة نافذة في قطاع تعمل فيه</li><li><b>ب.</b> مشروع بالنسبة للشركة حتى تنال ترخيص الهيئة</li><li><b>ج.</b> لا تعني الشركة بأي حال، فلا تُذكر في أي مذكرة لها</li><li><b>د.</b> لا تلزمها مباشرة، وقد تصلها شروطها عبر عقد المشغل</li></ul></li>
<li><p>وصلك رابط وثيقة جديدة عن الذكاء الاصطناعي، وطُلب منك أن تقول في دقيقتين هل هي ملزمة. أي مجموعة أسئلة تحسم ذلك قبل قراءة مضمونها؟</p><ul><li><b>أ.</b> من أصدرها وبأي أداة، وما حالتها وجزاؤها، ومن تخاطب</li><li><b>ب.</b> كم مرة تتكرر فيها «يجب»، وكم عدد موادها</li><li><b>ج.</b> هل نشرتها وسائل الإعلام، وهل علّق عليها الخبراء</li><li><b>د.</b> هل كتبتها جهة حكومية أو شبه حكومية، أيًّا كانت أداتها</li></ul></li>
<li><p>قد يكون النص ملزمًا في ذاته، ولا يفرض مع ذلك أي واجب على شركتك.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>شركة سعودية تطوّر مساعدًا للكتابة وتطرحه في متجر تطبيقات يخدم دول الاتحاد الأوروبي، ولا مكتب لها في الاتحاد. هل يسري عليها قانون الذكاء الاصطناعي الأوروبي؟</p><ul><li><b>أ.</b> لا: يسري القانون على الشركات المسجلة في دول الاتحاد وحدها</li><li><b>ب.</b> نعم: يسري على من يطرح نظامًا في سوق الاتحاد أينما كان</li><li><b>ج.</b> لا: لا يسري حتى تصادق المملكة على اتفاقية دولية بشأنه</li><li><b>د.</b> نعم: لكن واجباتها تبدأ حين تفتح مكتبًا داخل الاتحاد</li></ul></li>
<li><p>حين يُغلق باب التعليق على مشروع نص في منصة «استطلاع»، يصبح المشروع نافذًا من يوم الإغلاق.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>ملخص مساعد لمشروع لائحة يقول: «تسري اللائحة بعد 180 يومًا من نشرها». قرأت المشروع كله فلم تجد فيه أي موعد للسريان. بماذا تسم الادعاء؟</p><ul><li><b>أ.</b> غير مسند: النص صامت عن الموعد، فلا سند ولا نقيض</li><li><b>ب.</b> خاطئ: كل ادعاء لا تجده في النص ادعاء خاطئ</li><li><b>ج.</b> صحيح: 180 يومًا مدة معتادة لسريان اللوائح الوطنية</li><li><b>د.</b> صحيح: ما دام المساعد قد ذكر رقمًا محددًا</li></ul></li>
<li><p>ملخص لمشروع لائحة يقول: «تحتفظ الجهة بسجلات المعالجة ثلاث سنوات». والمادة 14 من المشروع تقول: «خمس سنوات من انتهاء المعالجة». بماذا تسم الادعاء؟</p><ul><li><b>أ.</b> صحيح: المادة 14 تذكر الاحتفاظ بالسجلات</li><li><b>ب.</b> غير مسند: المادة لا تذكر ثلاث سنوات أصلًا</li><li><b>ج.</b> خاطئ: المادة تحدد خمس سنوات لا ثلاثًا</li><li><b>د.</b> صحيح: فرق المدة تفصيل لا يغيّر الحكم</li></ul></li>
<li><p>إذا ذكر المساعد رقم بند بعد كل نقطة في ملخصه، فهذا يكفي دليلًا على أن الملخص صحيح.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>ادعاء صحيح في جزء منه وخاطئ في جزء آخر يُوسم «خاطئًا».</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>تراجع ملخصًا أعده مساعد لمشروع نص جديد قبل أن يُعرض على الفريق التنفيذي. كيف تتحقق من ادعاء فيه؟</p><ul><li><b>أ.</b> تسأل المساعد نفسه: هل أنت متأكد من هذه النقطة؟</li><li><b>ب.</b> تقارنه بملخص من مساعد آخر، فإن اتفقا فهو صحيح</li><li><b>ج.</b> تقبله إن كان المساعد قد ذكر رقم البند بعده</li><li><b>د.</b> تفتح النص الأصلي، وتجد البند، وتقارن ما يقوله</li></ul></li>
<li><p>مذكرة انطباق مؤرخة 18 نوفمبر 2026، والإصدار التالي من الإحاطة في 18 مايو 2027. واجب ملزم في نظام أجنبي يخاطب جهتك ويسري في 1 سبتمبر 2027. أين تضعه؟</p><ul><li><b>أ.</b> الآن: كل واجب ملزم يُكتب في «الآن» أيًّا كان موعده</li><li><b>ب.</b> التالي: ملزم، ويسري بعد الإصدار التالي</li><li><b>ج.</b> قيد المتابعة: لم يسرِ بعد، فلا عمل عليه اليوم</li><li><b>د.</b> لا ينطبق: النظام أجنبي، والمذكرة لوحدة سعودية</li></ul></li>
<li><p>كتب مدير المنتجات مذكرة الانطباق لوحدته، وهو أيضًا مالك نظام التوصيات المذكور فيها. من يعتمد سطر نظام التوصيات؟</p><ul><li><b>أ.</b> مدير المنتجات نفسه: هو أعلم الناس بالنظام</li><li><b>ب.</b> كاتب المذكرة، ما دام قد راجع أسطرها كلها</li><li><b>ج.</b> مالك النظام ونائبه معًا، ليكون الاعتماد مشتركًا</li><li><b>د.</b> المستشار القانوني: ليس مالك السطر ولا كاتب المذكرة</li></ul></li>
<li><p>مسودة لائحة قطاعية ما زالت معروضة للتعليق العام، ولا موعد معلنًا لاعتمادها، وقد تمس أحد أنظمة وحدتك. ما الذي يكتمل به سطرها في المذكرة؟</p><ul><li><b>أ.</b> قيد المتابعة، مع حدث مسمّى ومسؤول يراقبه</li><li><b>ب.</b> الآن، مع خطة تطبيق كاملة تبدأ في هذا الفصل</li><li><b>ج.</b> التالي، مع موعد بدء بعد الإصدار القادم</li><li><b>د.</b> لا ينطبق، فالنص لم يُعتمد ولا يُذكر</li></ul></li>
<li><p>في مذكرة انطباق سطر نصه: «المسؤول: الإدارة القانونية وإدارة المنتج». ما المشكلة فيه؟</p><ul><li><b>أ.</b> لا مشكلة: إشراك إدارتين يضمن متابعة السطر</li><li><b>ب.</b> المسؤول يجب أن يكون كاتب المذكرة نفسه</li><li><b>ج.</b> لكل سطر مسؤول واحد بالاسم، لا إدارتان</li><li><b>د.</b> المسؤول يُكتب بعد اعتماد المذكرة لا قبله</li></ul></li>
<li><p>سطر ملزم في مذكرة مؤرخة 18 نوفمبر 2026، حدثه القادم في 1 فبراير 2027، والإصدار التالي في 18 مايو 2027. ما موعد مراجعة السطر؟</p><ul><li><b>أ.</b> 18 مايو 2027: المراجعة عند الإصدار التالي دائمًا</li><li><b>ب.</b> 1 فبراير 2027 أو قبله: أبكر الموعدين</li><li><b>ج.</b> بعد سنة من تاريخ المذكرة، كأي وثيقة داخلية</li><li><b>د.</b> لا مراجعة له ما دام في «الآن»</li></ul></li>
<li><p>سطر «لا ينطبق» يُحذف من مذكرة الانطباق، فالمذكرة للالتزامات وحدها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في سطر المذكرة يُكتب تاريخ سريان الالتزام، لا تاريخ صدور النص.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
